name: Manual Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Debug Windows

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Build Resources (Meson)
        run: |
          export GI_TYPELIB_PATH=/ucrt64/lib/girepository-1.0
          meson setup build
          meson compile -C build

      - name: Bundle with PyInstaller (GTK4 SAFE)
        run: |
          pip install pyinstaller

          # --- paths ---
          ICON_PATH=$(cygpath -w app.ico)
          TYPELIB_PATH=$(cygpath -w /ucrt64/lib/girepository-1.0)
          PIXBUF_DIR=/ucrt64/lib/gdk-pixbuf-2.0/2.10.0
          GST_PLUGIN_DIR=/ucrt64/lib/gstreamer-1.0

          # --- runtime hook ---
          cat > rthook_gi.py <<'EOF'
          import os, sys
          if hasattr(sys, "_MEIPASS"):
              os.environ["PATH"] = sys._MEIPASS + os.pathsep + os.environ.get("PATH", "")
              os.environ["GDK_BACKEND"] = "win32"
              os.environ["GTK_INSPECTOR"] = ""
              os.environ["G_MESSAGES_DEBUG"] = ""
              os.environ["GI_TYPELIB_PATH"] = os.path.join(sys._MEIPASS, "lib", "girepository-1.0")
              os.environ["GIO_MODULE_DIR"] = os.path.join(sys._MEIPASS, "gio", "modules")
          EOF

          pyinstaller --onedir --console --name Chronograph \
            --icon="$ICON_PATH" \
            --runtime-hook rthook_gi.py \
            --add-data "$TYPELIB_PATH:lib/girepository-1.0" \
            --add-binary "/ucrt64/bin/libgtk-4-1.dll:." \
            --add-binary "/ucrt64/bin/libgdk-4-1.dll:." \
            --add-binary "/ucrt64/bin/libgdk-win32-4.0.dll:." \
            --add-binary "/ucrt64/lib/gio/modules/*.dll:gio/modules" \
            --add-binary "$PIXBUF_DIR/loaders/*.dll:." \
            --add-binary "$GST_PLUGIN_DIR/*.dll:gst-plugins" \
            debug_runner.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chronograph-Windows
          path: dist/Chronograph
